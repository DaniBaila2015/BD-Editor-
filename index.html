<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Comic Studio Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
        body { display: flex; height: 100vh; background-color: #1e1e24; color: #f5f5f7; overflow: hidden; }
        
        /* Barra Lateral de Ferramentas - Design Moderno */
        #sidebar { width: 90px; background: #2a2a35; display: flex; flex-direction: column; align-items: center; padding: 15px 5px; gap: 12px; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 10; justify-content: space-between; }
        .tool-group { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        
        button { width: 70px; height: 65px; border: none; border-radius: 14px; background: #3a3a4a; color: #a0a0b0; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s ease; }
        button span { font-size: 22px; }
        button:active, button.active { background: #007aff; color: white; transform: scale(0.95); box-shadow: 0 4px 12px rgba(0,122,255,0.4); }
        button.danger { background: #ff3b30; color: white; }
        button.danger:active { background: #d32f2f; }
        
        /* Input de Cor Customizado */
        .color-wrapper { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.2); position: relative; }
        input[type="color"] { position: absolute; top: -10px; left: -10px; width: 80px; height: 80px; cursor: pointer; border: none; }
        
        /* Área Central do Canvas */
        #workspace { flex: 1; display: flex; flex-direction: column; height: 100%; }
        #top-bar { height: 60px; background: #2a2a35; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #top-bar h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; color: #fff; }
        .file-actions { display: flex; gap: 10px; }
        .file-actions button { height: 40px; width: auto; padding: 0 16px; flex-direction: row; gap: 6px; font-size: 13px; background: #3a3a4a; color: #fff; }
        
        #canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px; overflow: auto; background: #141419; }
        canvas { background: white; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); touch-action: none; }
    </style>
</head>
<body>

    <!-- BARRA LATERAL (Ferramentas de Desenho) -->
    <div id="sidebar">
        <div class="tool-group">
            <div class="color-wrapper">
                <input type="color" id="shape-color" value="#000000">
            </div>
            <button id="tool-select" class="active" onclick="setTool('select')"><span>🖐️</span>Mover</button>
            <button id="tool-draw" onclick="setTool('draw')"><span>✏️</span>Livre</button>
            <button id="tool-line" onclick="setTool('line')"><span>➖</span>Linha</button>
            <button id="tool-rect" onclick="setTool('rect')"><span>🟩</span>Retâng</button>
            <button id="tool-circle" onclick="setTool('circle')"><span>⭕</span>Círculo</button>
            <button id="tool-text" onclick="setTool('text')"><span>🔤</span>Texto</button>
        </div>
        
        <div class="tool-group">
            <button onclick="deleteSelected()" style="background: #444454; color: #ff453a;"><span>❌</span>Apagar</button>
            <button onclick="clearAll()" class="danger"><span>🗑️</span>Limpar</button>
        </div>
    </div>

    <!-- ÁREA PRINCIPAL -->
    <div id="workspace">
        <div id="top-bar">
            <h1>🎨 Comic Studio Pro</h1>
            <div class="file-actions">
                <button onclick="saveToBrowser()">💾 Guardar</button>
                <button onclick="loadFromBrowser()">📂 Carregar</button>
                <button onclick="downloadCanvas()" style="background: #34c759;">📥 Descarregar PNG</button>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="mainCanvas" width="900" height="650"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('shape-color');
        
        let shapes = [];
        let currentTool = 'select';
        let isDrawing = false;
        let selectedShape = null;
        let resizeHandle = null;
        let startX, startY;
        let currentFreePath = null;
        const HANDLE_SIZE = 10;

        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#sidebar button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`tool-${tool}`);
            if(btn) btn.classList.add('active');
            if(tool !== 'select') selectedShape = null;
            draw();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function onPointerDown(e) {
            canvas.setPointerCapture(e.pointerId);
            const pos = getMousePos(e);
            startX = pos.x;
            startY = pos.y;

            if (currentTool === 'select') {
                if (selectedShape && selectedShape.type !== 'draw') {
                    resizeHandle = getResizeHandle(pos.x, pos.y, selectedShape);
                    if (resizeHandle) { isDrawing = true; return; }
                }
                selectedShape = [...shapes].reverse().find(s => isPointInShape(pos.x, pos.y, s));
                if (selectedShape) isDrawing = true;
                draw();
            } else if (currentTool === 'text') {
                const textStr = prompt("Texto da tua BD:");
                if (textStr) {
                    shapes.push({
                        type: 'text', x: pos.x, y: pos.y, w: ctx.measureText(textStr).width + 20, h: 30,
                        text: textStr, color: colorPicker.value
                    });
                }
                setTool('select');
            } else if (currentTool === 'draw') {
                isDrawing = true;
                currentFreePath = { type: 'draw', points: [{x: pos.x, y: pos.y}], color: colorPicker.value };
                shapes.push(currentFreePath);
                selectedShape = currentFreePath;
            } else {
                isDrawing = true;
                const newShape = { type: currentTool, x: pos.x, y: pos.y, w: 0, h: 0, color: colorPicker.value };
                shapes.push(newShape);
                selectedShape = newShape;
            }
        }

        function onPointerMove(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);

            if (currentTool === 'select' && selectedShape) {
                if (resizeHandle) {
                    if (resizeHandle.includes('e')) selectedShape.w = pos.x - selectedShape.x;
                    if (resizeHandle.includes('s')) selectedShape.h = pos.y - selectedShape.y;
                    if (resizeHandle.includes('w')) { selectedShape.w += selectedShape.x - pos.x; selectedShape.x = pos.x; }
                    if (resizeHandle.includes('n')) { selectedShape.h += selectedShape.y - pos.y; selectedShape.y = pos.y; }
                } else if (selectedShape.type === 'draw') {
                    const dx = pos.x - startX;
                    const dy = pos.y - startY;
                    selectedShape.points.forEach(p => { p.x += dx; p.y += dy; });
                    startX = pos.x; startY = pos.y;
                } else {
                    const dx = pos.x - startX;
                    const dy = pos.y - startY;
                    selectedShape.x += dx;
                    selectedShape.y += dy;
                    startX = pos.x; startY = pos.y;
                }
            } else if (currentTool === 'draw' && currentFreePath) {
                currentFreePath.points.push({x: pos.x, y: pos.y});
            } else if (selectedShape) {
                selectedShape.w = pos.x - selectedShape.x;
                selectedShape.h = pos.y - selectedShape.y;
            }
            draw();
        }

        function onPointerUp(e) {
            isDrawing = false;
            resizeHandle = null;
            currentFreePath = null;
            shapes = shapes.filter(s => s.type === 'draw' || s.type === 'text' || Math.abs(s.w) > 4 || Math.abs(s.h) > 4);
            draw();
        }

        function draw() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            shapes.forEach(shape => {
                ctx.strokeStyle = shape.color;
                ctx.fillStyle = shape.color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                if (shape.type === 'draw') {
                    if (shape.points.length < 2) return;
                    ctx.moveTo(shape.points[0].x, shape.points[0].y);
                    for (let i = 1; i < shape.points.length; i++) {
                        ctx.lineTo(shape.points[i].x, shape.points[i].y);
                    }
ctx.stroke();
} else if (shape.type === 'line') {
ctx.moveTo(shape.x, shape.y);
ctx.lineTo(shape.x + shape.w, shape.y + shape.h);
ctx.stroke();
} else if (shape.type === 'rect') {
ctx.strokeRect(shape.x, shape.y, shape.w, shape.h);
} else if (shape.type === 'circle') {
let r = Math.sqrt(shape.wshape.w + shape.hshape.h) / 2;
ctx.arc(shape.x + shape.w/2, shape.y + shape.h/2, Math.abs(r), 0, 2 * Math.PI);
ctx.stroke();
} else if (shape.type === 'text') {
ctx.font = "bold 26px 'Comic Sans MS', Impact, sans-serif";
ctx.textBaseline = 'top';
ctx.fillText(shape.text, shape.x, shape.y);
}
});
if (selectedShape && currentTool === 'select' && selectedShape.type !== 'draw') {
ctx.strokeStyle = '#007aff';
ctx.lineWidth = 2;
ctx.strokeRect(selectedShape.x, selectedShape.y, selectedShape.w, selectedShape.h);
const hc = getHandlesCoords(selectedShape);
ctx.fillStyle = '#007aff';
Object.values(hc).forEach(h => ctx.fillRect(h.x - HANDLE_SIZE/2, h.y - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE));
}
}
function isPointInShape(px, py, s) {
if (s.type === 'draw') {
return s.points.some(p => Math.abs(p.x - px) < 15 && Math.abs(p.y - py) < 15);
}
const minX = Math.min(s.x, s.x + s.w); const maxX = Math.max(s.x, s.x + s.w);
const minY = Math.min(s.y, s.y + s.h); const maxY = Math.max(s.y, s.y + s.h);
return px >= minX - 10 && px <= maxX + 10 && py >= minY - 10 && py <= maxY + 10;
}
function getHandlesCoords(s) {
return { nw: { x: s.x, y: s.y }, ne: { x: s.x + s.w, y: s.y }, se: { x: s.x + s.w, y: s.y + s.h }, sw: { x: s.x, y: s.y + s.h } };
}
function getResizeHandle(px, py, s) {
const hc = getHandlesCoords(s);
for (const [key, h] of Object.entries(hc)) {
if (px >= h.x - HANDLE_SIZE && px <= h.x + HANDLE_SIZE && py >= h.y - HANDLE_SIZE && py <= h.y + HANDLE_SIZE) return key;
}
return null;
}
function deleteSelected() { if (selectedShape) { shapes = shapes.filter(s => s !== selectedShape); selectedShape = null; draw(); } }
function clearAll() { if (confirm("Apagar tudo?")) { shapes = []; selectedShape = null; draw(); } }
function downloadCanvas() {
selectedShape = null; draw();
const link = document.createElement('a');
link.download = 'quadradinho-bd.png';
link.href = canvas.toDataURL('image/png');
link.click();
}
function saveToBrowser() { localStorage.setItem('comic_studio_data', JSON.stringify(shapes)); alert('História guardada no iPad!'); }
function loadFromBrowser() { const data = localStorage.getItem('comic_studio_data'); if (data) { shapes = JSON.parse(data); draw(); } else { alert('Sem dados guardados!'); } }
draw();
